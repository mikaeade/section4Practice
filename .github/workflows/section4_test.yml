name: Section4Workflow
on:
  pull_request:
    types: [opened]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: printf '%s\n' "$GITHUB_EVENT"
        env:
          GITHUB_EVENT: ${{ toJSON(github.event) }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
  build:
    runs-on: ubuntu-latest
    outputs: 
      appName: ${{steps.outputAppName.outputs.appName}}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: dist-files_mieade
          path: dist/
      - name: get_the_app_name
        id: outputAppName
        run: |
          app_file=$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)
          if [[ -z "$app_file" ]]; then
            echo "No JavaScript bundle found in dist/assets" >&2
            exit 1
          fi
          echo "appName=$(basename "$app_file")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: getBuildName
        run: echo "${{needs.build.outputs.appName}}"

